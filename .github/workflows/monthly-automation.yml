name: Create Monthly Assignment Issues

on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      assignment:
        description: "Assignment key or name from config/monthly-assignments.yml"
        required: true
        type: string
      month:
        description: "Month to create (YYYY-MM). Leave blank for current month."
        required: false
        type: string
      due_date:
        description: "Due date (YYYY-MM-DD)"
        required: true
        type: string
      priority:
        description: "Priority"
        required: true
        type: choice
        options:
          - Low
          - Medium
          - High
          - Critical
        default: Medium
      status:
        description: "Status"
        required: true
        type: choice
        options:
          - Not Started
          - In Progress
          - Complete
        default: Not Started

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-assignment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-monthly-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine month
        id: period
        shell: bash
        run: |
          PERIOD="${{ inputs.month }}"
          if [ -z "$PERIOD" ]; then
            PERIOD="$(date -u +%Y-%m)"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Load assignment from config
        id: assignment
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_PATH="config/monthly-assignments.yml"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "ERROR: $CONFIG_PATH not found in repository"
            exit 1
          fi

          INPUT="${{ inputs.assignment }}"

          CONFIG_JSON=$(ruby -ryaml -rjson -e 'puts YAML.load_file("config/monthly-assignments.yml").to_json')

          ASSIGNMENT_JSON=$(echo "$CONFIG_JSON" | jq -r --arg k "$INPUT" '(.assignments[$k]) // (.assignments[] | select(.name == $k)) // empty')

          if [ -z "$ASSIGNMENT_JSON" ]; then
            echo "ERROR: assignment '$INPUT' not found in $CONFIG_PATH"
            exit 1
          fi

          PROGRAMMER=$(echo "$ASSIGNMENT_JSON" | jq -r '.programmer // empty')
          PROGRAMMER2=$(echo "$ASSIGNMENT_JSON" | jq -r '.programmer2 // empty')
          CHECKER=$(echo "$ASSIGNMENT_JSON" | jq -r '.checker // empty')
          CHECKER2=$(echo "$ASSIGNMENT_JSON" | jq -r '.checker2 // empty')
          ASSIGNMENT_NAME=$(echo "$ASSIGNMENT_JSON" | jq -r '.name // empty')

          echo "programmer=$PROGRAMMER" >> "$GITHUB_OUTPUT"
          echo "programmer2=$PROGRAMMER2" >> "$GITHUB_OUTPUT"
          echo "checker=$CHECKER" >> "$GITHUB_OUTPUT"
          echo "checker2=$CHECKER2" >> "$GITHUB_OUTPUT"
          echo "assignment_name=$ASSIGNMENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate assignments
        shell: bash
        env:
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
        run: |
          # PROGRAMMER and CHECKER are required; programmer2/checker2 are optional.
          if [ -z "$PROGRAMMER" ] || [ -z "$CHECKER" ]; then
            echo "ERROR: PROGRAMMER and CHECKER must be set."
            exit 1
          fi

          values=("$PROGRAMMER" "$PROGRAMMER2" "$CHECKER" "$CHECKER2")

          # Count non-empty values and unique non-empty values to detect duplicates among provided roles
          non_empty_count=$(printf '%s\n' "${values[@]}" | awk 'NF' | wc -l)
          unique_count=$(printf '%s\n' "${values[@]}" | awk 'NF' | sort -u | wc -l)

          if [ "$unique_count" -ne "$non_empty_count" ]; then
            echo "ERROR: Provided roles must be unique (no duplicate usernames among programmer/programmer2/checker/checker2)."
            exit 1
          fi

      - name: Create monthly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PERIOD: ${{ steps.period.outputs.period }}
          INPUT_ASSIGNMENT: ${{ inputs.assignment }}
          ASSIGNMENT: ${{ steps.assignment.outputs.assignment_name }}
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
          DUE_DATE: ${{ inputs.due_date }}
          PRIORITY: ${{ inputs.priority }}
          STATUS: ${{ inputs.status }}
        shell: bash
        run: |
          if [ -z "${ASSIGNMENT}" ]; then
            ASSIGNMENT="${INPUT_ASSIGNMENT}"
          fi

          TITLE="Monthly Assignment - ${ASSIGNMENT} - ${PERIOD}"

          # Build assignee list without empty entries
          assignees=()
          assignees+=("${PROGRAMMER}")
          if [ -n "${PROGRAMMER2}" ]; then
            assignees+=("${PROGRAMMER2}")
          fi
          assignees+=("${CHECKER}")
          if [ -n "${CHECKER2}" ]; then
            assignees+=("${CHECKER2}")
          fi
          ASSIGNEES_STR=$(IFS=, ; echo "${assignees[*]}")

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state all \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi

          # Build the team markdown table conditionally
          TEAM_TABLE="| Role | GitHub Username |\n|---|---|\n| Programmer | @${PROGRAMMER} |"
          if [ -n "${PROGRAMMER2}" ]; then
            TEAM_TABLE="${TEAM_TABLE}\n| Programmer 2 | @${PROGRAMMER2} |"
          fi
          TEAM_TABLE="${TEAM_TABLE}\n| Checker | @${CHECKER} |"
          if [ -n "${CHECKER2}" ]; then
            TEAM_TABLE="${TEAM_TABLE}\n| Checker 2 | @${CHECKER2} |"
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --label "Monthly Assignment" \
            --assignee "$ASSIGNEES_STR" \
            --body "$(cat <<EOF
## Monthly Assignment
Assignment: ${ASSIGNMENT}
Period: ${PERIOD}

## Team
${TEAM_TABLE}

## Metadata
| Field | Value |
|---|---|
| Assigned Date | $(date -u +%Y-%m-%d) |
| Due Date | ${DUE_DATE} |
| Status | ${STATUS} |
| Priority | ${PRIORITY} |

## Tasks
- [ ] Complete monthly assignment
- [ ] Programmer review
- [ ] Checker review
- [ ] Finalize

## Notes

## Action Items
| Action | Owner | Due Date |
|---|---|---|
| | | |
EOF
)"
