name: Create Monthly Assignment Issues

on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      month:
        description: "Month to create (YYYY-MM). Leave blank for current month."
        required: false
        type: string
      due_date:
        description: "Due date (YYYY-MM-DD)"
        required: false
        type: string
      priority:
        description: "Priority"
        required: false
        type: choice
        options:
          - Low
          - Medium
          - High
          - Critical
        default: Medium
      status:
        description: "Status"
        required: false
        type: choice
        options:
          - Not Started
          - In Progress
          - Complete
        default: Not Started

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-assignment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-monthly-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine month
        id: period
        shell: bash
        run: |
          PERIOD="${{ inputs.month }}"
          if [ -z "$PERIOD" ]; then
            PERIOD="$(date -u +%Y-%m)"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Set defaults for scheduled runs
        id: defaults
        shell: bash
        run: |
          DUE_DATE="${{ inputs.due_date }}"
          PRIORITY="${{ inputs.priority }}"
          STATUS="${{ inputs.status }}"

          if [ -z "$DUE_DATE" ]; then
            DUE_DATE=$(date -u -d "+30 days" +%Y-%m-%d)
          fi
          if [ -z "$PRIORITY" ]; then
            PRIORITY="Medium"
          fi
          if [ -z "$STATUS" ]; then
            STATUS="Not Started"
          fi

          echo "due_date=$DUE_DATE" >> "$GITHUB_OUTPUT"
          echo "priority=$PRIORITY" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Create monthly issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PERIOD: ${{ steps.period.outputs.period }}
          DUE_DATE: ${{ steps.defaults.outputs.due_date }}
          PRIORITY: ${{ steps.defaults.outputs.priority }}
          STATUS: ${{ steps.defaults.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_PATH="config/monthly-assignments.yml"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "ERROR: $CONFIG_PATH not found in repository"
            exit 1
          fi

          CONFIG_JSON=$(ruby -rjson -e 'require "yaml"; puts YAML.load_file(ARGV[0]).to_json' "$CONFIG_PATH")

          echo "$CONFIG_JSON" | jq -c '.assignments | to_entries[]' | while IFS= read -r entry; do
            ASSIGNMENT_KEY=$(echo "$entry" | jq -r '.key')
            ASSIGNMENT_DATA=$(echo "$entry" | jq -c '.value')
            ASSIGNMENT_NAME=$(echo "$ASSIGNMENT_DATA" | jq -r '.name // empty')
            if [ -z "$ASSIGNMENT_NAME" ]; then
              ASSIGNMENT_NAME="$ASSIGNMENT_KEY"
            fi

            PROGRAMMER=$(echo "$ASSIGNMENT_DATA" | jq -r '.programmer // empty')
            PROGRAMMER2=$(echo "$ASSIGNMENT_DATA" | jq -r '.programmer2 // empty')
            CHECKER=$(echo "$ASSIGNMENT_DATA" | jq -r '.checker // empty')
            CHECKER2=$(echo "$ASSIGNMENT_DATA" | jq -r '.checker2 // empty')

            if [ -z "$PROGRAMMER" ] || [ -z "$CHECKER" ]; then
              echo "ERROR: assignment '$ASSIGNMENT_NAME' is missing PROGRAMMER and/or CHECKER."
              exit 1
            fi

            values=("$PROGRAMMER" "$PROGRAMMER2" "$CHECKER" "$CHECKER2")
            non_empty_count=$(printf '%s\n' "${values[@]}" | awk 'NF' | wc -l)
            unique_count=$(printf '%s\n' "${values[@]}" | awk 'NF' | sort -u | wc -l)

            if [ "$unique_count" -ne "$non_empty_count" ]; then
              echo "ERROR: assignment '$ASSIGNMENT_NAME' contains duplicate usernames among assigned roles."
              exit 1
            fi

            TITLE="Monthly Assignment - ${ASSIGNMENT_NAME} - ${PERIOD}"

            EXISTING=$(gh issue list \
              --repo "$REPO" \
              --state all \
              --search "\"$TITLE\" in:title" \
              --json number \
              --jq 'length')

            if [ "$EXISTING" -gt 0 ]; then
              echo "Issue already exists: $TITLE"
              continue
            fi

            assignees=("$PROGRAMMER")
            if [ -n "$PROGRAMMER2" ]; then
              assignees+=("$PROGRAMMER2")
            fi
            assignees+=("$CHECKER")
            if [ -n "$CHECKER2" ]; then
              assignees+=("$CHECKER2")
            fi
            ASSIGNEES_STR=$(IFS=,; echo "${assignees[*]}")

            BODY_FILE=$(mktemp)
            trap 'rm -f "$BODY_FILE"' EXIT

            cat > "$BODY_FILE" <<EOF
            ## Monthly Assignment
            Assignment: ${ASSIGNMENT_NAME}
            Period: ${PERIOD}

            ## Metadata
            | Field | Value |
            |---|---|
            | Assigned Date | $(date -u +%Y-%m-%d) |
            | Due Date | ${DUE_DATE} |
            | Status | ${STATUS} |
            | Priority | ${PRIORITY} |

            ## Tasks
            - [ ] Complete monthly assignment
            - [ ] Programmer review
            - [ ] Checker review
            - [ ] Finalize

            ## Notes

            ## Action Items
            | Action | Owner | Due Date |
            |---|---|---|
            | | | |
          EOF

            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --label "Monthly Assignment" \
              --assignee "$ASSIGNEES_STR" \
              --body-file "$BODY_FILE"
          done
