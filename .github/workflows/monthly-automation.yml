name: Create Monthly Assignment Issues

on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      assignment:
        description: "Assignment to create"
        required: true
        type: string
      month:
        description: "Month to create (YYYY-MM). Leave blank for current month."
        required: false
        type: string
      due_date:
        description: "Due date (YYYY-MM-DD)"
        required: true
        type: string
      priority:
        description: "Priority"
        required: true
        type: choice
        options:
          - Low
          - Medium
          - High
          - Critical
        default: Medium
      status:
        description: "Status"
        required: true
        type: choice
        options:
          - Not Started
          - In Progress
          - Complete
        default: Not Started

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-assignment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-monthly-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Determine month
        id: period
        shell: bash
        run: |
          PERIOD="${{ inputs.month }}"
          if [ -z "$PERIOD" ]; then
            PERIOD="$(date -u +%Y-%m)"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Get assignment team
        id: assignment
        shell: bash
        run: |
          # Replace with real config logic
          PROGRAMMER="user01"
          PROGRAMMER2="user02"
          CHECKER="user03"
          CHECKER4="user04"

          echo "programmer=$PROGRAMMER" >> "$GITHUB_OUTPUT"
          echo "programmer2=$PROGRAMMER2" >> "$GITHUB_OUTPUT"
          echo "checker=$CHECKER" >> "$GITHUB_OUTPUT"
          echo "checker2=$CHECKER4" >> "$GITHUB_OUTPUT"

      - name: Validate assignments
        shell: bash
        env:
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
        run: |
          values=("$PROGRAMMER" "$PROGRAMMER2" "$CHECKER" "$CHECKER2")
          for v in "${values[@]}"; do
            if [ -z "$v" ]; then
              echo "ERROR: All assignment roles must be set."
              exit 1
            fi
          done

          unique=$(printf '%s\n' "${values[@]}" | sort -u | wc -l)
          if [ "$unique" -ne 4 ]; then
            echo "ERROR: The four roles must have different users."
            exit 1
          fi

      - name: Create monthly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PERIOD: ${{ steps.period.outputs.period }}
          ASSIGNMENT: ${{ inputs.assignment }}
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
          DUE_DATE: ${{ inputs.due_date }}
          PRIORITY: ${{ inputs.priority }}
          STATUS: ${{ inputs.status }}
        shell: bash
        run: |
          TITLE="Monthly Assignment - ${ASSIGNMENT} - ${PERIOD}"

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state all \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --label "Monthly Assignment" \
            --assignee "$PROGRAMMER,$PROGRAMMER2,$CHECKER,$CHECKER2" \
            --body "$(cat <<EOF
## Monthly Assignment
Assignment: ${ASSIGNMENT}
Period: ${PERIOD}

## Team
| Role | GitHub Username |
|---|---|
| Programmer | @${PROGRAMMER} |
| Programmer 2 | @${PROGRAMMER2} |
| Checker | @${CHECKER} |
| Checker 2 | @${CHECKER2} |

## Metadata
| Field | Value |
|---|---|
| Assigned Date | $(date -u +%Y-%m-%d) |
| Due Date | ${DUE_DATE} |
| Status | ${STATUS} |
| Priority | ${PRIORITY} |

## Tasks
- [ ] Complete monthly assignment
- [ ] Programmer review
- [ ] Checker review
- [ ] Finalize

## Notes

## Action Items
| Action | Owner | Due Date |
|---|---|---|
| | | |
EOF
)"
