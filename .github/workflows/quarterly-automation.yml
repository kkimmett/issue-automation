name: Create Quarterly Issue

on:
  schedule:
    #- cron: "0 9 1 1,4,7,10"  # 09:00 UTC on the first day of Jan, Apr, Jul, Oct
    - cron: "/30 * * * *" # Every 30 minutes 
  workflow_dispatch:
    inputs:
      assignment:
        description: "Assignment key or name from config/quarterly-assignments.yml"
        required: true
        type: string
      quarter:
        description: "Quarter (YYYY-Q#). Leave blank for current quarter."
        required: false
        type: string
      due_date:
        description: "Due date (YYYY-MM-DD)"
        required: true
        type: string
      priority:
        description: "Priority"
        required: true
        type: choice
        options:
          - Low
          - Medium
          - High
          - Critical
        default: Medium
      status:
        description: "Status"
        required: true
        type: choice
        options:
          - Not Started
          - In Progress
          - Complete
        default: Not Started

permissions:
  contents: read
  issues: write

concurrency:
  group: quarterly-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-quarterly-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine quarter
        id: period
        shell: bash
        run: |
          PERIOD="${{ inputs.quarter }}"
          if [ -z "$PERIOD" ]; then
            YEAR=$(date -u +%Y)
            MONTH=$(date -u +%-m)
            QUARTER=$(((MONTH - 1) / 3 + 1))
            PERIOD="${YEAR}-Q${QUARTER}"
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Load assignment from config
        id: assignment
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_PATH="config/quarterly-assignments.yml"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "ERROR: $CONFIG_PATH not found in repository"
            exit 1
          fi

          INPUT="${{ inputs.assignment }}"

          CONFIG_JSON=$(ruby -ryaml -rjson -e 'puts YAML.load_file("config/quarterly-assignments.yml").to_json')

          ASSIGNMENT_JSON=$(echo "$CONFIG_JSON" | jq -r --arg k "$INPUT" '(.assignments[$k]) // (.assignments[] | select(.name == $k)) // empty')

          if [ -z "$ASSIGNMENT_JSON" ]; then
            echo "ERROR: assignment '$INPUT' not found in $CONFIG_PATH"
            exit 1
          fi

          PROGRAMMER=$(echo "$ASSIGNMENT_JSON" | jq -r '.programmer // empty')
          PROGRAMMER2=$(echo "$ASSIGNMENT_JSON" | jq -r '.programmer2 // empty')
          CHECKER=$(echo "$ASSIGNMENT_JSON" | jq -r '.checker // empty')
          CHECKER2=$(echo "$ASSIGNMENT_JSON" | jq -r '.checker2 // empty')
          ASSIGNMENT_NAME=$(echo "$ASSIGNMENT_JSON" | jq -r '.name // empty')

          echo "programmer=$PROGRAMMER" >> "$GITHUB_OUTPUT"
          echo "programmer2=$PROGRAMMER2" >> "$GITHUB_OUTPUT"
          echo "checker=$CHECKER" >> "$GITHUB_OUTPUT"
          echo "checker2=$CHECKER2" >> "$GITHUB_OUTPUT"
          echo "assignment_name=$ASSIGNMENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate assignments
        shell: bash
        env:
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
        run: |
          # Validate required roles
          if [ -z "$PROGRAMMER" ] || [ -z "$CHECKER" ]; then
            echo "ERROR: programmer and checker roles are required."
            exit 1
          fi

          # Build array of all provided roles (required + optional)
          declare -a roles
          roles+=("$PROGRAMMER")
          [ -n "$PROGRAMMER2" ] && roles+=("$PROGRAMMER2")
          roles+=("$CHECKER")
          [ -n "$CHECKER2" ] && roles+=("$CHECKER2")

          # Check for uniqueness among all provided roles
          unique=$(printf '%s\n' "${roles[@]}" | sort -u | wc -l)
          if [ "$unique" -ne "${#roles[@]}" ]; then
            echo "ERROR: All roles must have different users."
            exit 1
          fi

      - name: Create quarterly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PERIOD: ${{ steps.period.outputs.period }}
          INPUT_ASSIGNMENT: ${{ inputs.assignment }}
          ASSIGNMENT: ${{ steps.assignment.outputs.assignment_name }}
          PROGRAMMER: ${{ steps.assignment.outputs.programmer }}
          PROGRAMMER2: ${{ steps.assignment.outputs.programmer2 }}
          CHECKER: ${{ steps.assignment.outputs.checker }}
          CHECKER2: ${{ steps.assignment.outputs.checker2 }}
          DUE_DATE: ${{ inputs.due_date }}
          PRIORITY: ${{ inputs.priority }}
          STATUS: ${{ inputs.status }}
        shell: bash
        run: |
          if [ -z "${ASSIGNMENT}" ]; then
            ASSIGNMENT="${INPUT_ASSIGNMENT}"
          fi

          TITLE="Quarterly Review - ${ASSIGNMENT} - ${PERIOD}"

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state all \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi

          # Build assignee list, including only non-empty roles
          ASSIGNEES=("$PROGRAMMER")
          [ -n "$PROGRAMMER2" ] && ASSIGNEES+=("$PROGRAMMER2")
          ASSIGNEES+=("$CHECKER")
          [ -n "$CHECKER2" ] && ASSIGNEES+=("$CHECKER2")
          ASSIGNEE_LIST=$(IFS=,; echo "${ASSIGNEES[*]}")

          # Build team table with only non-empty roles
          TEAM_TABLE="| Role | GitHub Username |
|---|---|
| Programmer | @${PROGRAMMER} |"
          if [ -n "$PROGRAMMER2" ]; then
            TEAM_TABLE+="
| Programmer 2 | @${PROGRAMMER2} |"
          fi
          TEAM_TABLE+="
| Checker | @${CHECKER} |"
          if [ -n "$CHECKER2" ]; then
            TEAM_TABLE+="
| Checker 2 | @${CHECKER2} |"
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --label "Quarterly Review" \
            --assignee "$ASSIGNEE_LIST" \
            --body "$(cat <<EOF
## Quarterly Review
Assignment: ${ASSIGNMENT}
Quarter: ${PERIOD}

## Metadata
| Field | Value |
|---|---|
| Assigned Date | $(date -u +%Y-%m-%d) |
| Due Date | ${DUE_DATE} |
| Status | ${STATUS} |
| Priority | ${PRIORITY} |

## Quarterly Review
- [ ] Review previous quarter
- [ ] Review outstanding work
- [ ] Review metrics
- [ ] Identify issues and risks
- [ ] Establish next-quarter priorities

## Notes

## Action Items
| Action | Owner | Due Date |
|---|---|---|
| | | |
EOF
)"
